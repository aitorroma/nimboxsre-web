<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>404 — Ruta no encontrada | NimBox SRE</title>
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" />
    <style>
      @font-face{font-family:"DM Sans";src:url(/assets/fonts/aFTU7PB1QTsUX8KYthSQBLyM.woff2) format("woff2");font-display:swap}
      @font-face{font-family:"DM Mono";src:url(/assets/fonts/rP2Hp2ywxg089UriCZ2IHSeH.woff2) format("woff2");font-display:swap}
      :root{--ink:#111215;--paper:#faf9f6;--mint:#b4ee7a;--accent:#e9512e;--line:#d9d7d1;--muted:#686965}*{box-sizing:border-box}body{min-height:100vh;margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif;display:grid;grid-template-rows:auto 1fr}.top{border-bottom:1px solid var(--line);padding:23px max(24px,calc((100vw - 1230px)/2))}.top img{display:block;width:154px;height:auto}.lost{position:relative;isolation:isolate;overflow:hidden;display:grid;place-items:center;padding:70px 24px}.lost:before{content:"404";position:absolute;z-index:-1;color:#eeece6;font:900 clamp(12rem,38vw,38rem)/.7 "DM Mono",monospace;letter-spacing:-.13em;transform:translateX(-.07em)}.card{width:min(650px,100%);padding:clamp(28px,5vw,58px);background:var(--ink);color:#fff;box-shadow:14px 14px 0 var(--mint)}.eyebrow{margin:0 0 17px;color:var(--mint);font:500 .72rem/1.3 "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase}.card h1{max-width:500px;margin:0;font-size:clamp(2.3rem,5vw,4.8rem);line-height:.96;letter-spacing:-.07em}.card p{max-width:440px;margin:24px 0 32px;color:#b9b9b6;line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:12px}.actions a{display:inline-flex;align-items:center;justify-content:center;padding:13px 17px;font-weight:700;text-decoration:none}.home{background:var(--accent);color:#fff}.home:hover{background:var(--mint);color:var(--ink)}.app{border:1px solid #555650;color:#fff}.app:hover{border-color:#fff}.languages{margin-top:37px;padding-top:20px;border-top:1px solid #3d3e3a;color:#aaa;font:500 .7rem/1 "DM Mono",monospace;letter-spacing:.1em;text-transform:uppercase}.languages a{margin-left:12px;color:#fff;text-decoration:none}.languages a:hover{color:var(--mint)}@media(max-width:560px){.lost{padding:42px 20px}.card{box-shadow:8px 8px 0 var(--mint)}.actions{flex-direction:column}.actions a{width:100%}}
    </style>
  </head>
  <body>
    <header class="top"><a href="/" aria-label="NimBox SRE, inicio"><img src="/assets/nimbox-sre-logo.png" alt="NimBox SRE" /></a></header>
    <main class="lost">
      <section class="card" aria-labelledby="lost-title">
        <p class="eyebrow">Ruta no encontrada / 404</p>
        <h1 id="lost-title">Este host no responde.</h1>
        <p>La página que buscas no existe o ha cambiado de dirección. Vuelve al panel de operación y retomamos el contexto.</p>
        <div class="actions"><a class="home" href="/">Volver al inicio ↗</a><a class="app" href="https://app.nimboxsre.com/">Acceder a la app</a></div>
        <div class="languages">Idioma:<a href="/">ES</a><a href="/en/">EN</a><a href="/it/">IT</a></div>
      </section>
    </main>
  </body>
</html>
